<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plumfield Leadership Simulation - NCP preview</title>
<style>
  :root{
    --bg:#0b0a12; --data:#16121f; --console:#0d0a15; --decide:#1e1428; --surface2:#1b1526; --inset:#140d1b;
    --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.06);
    --ink:#f5f6f8; --muted:rgba(255,255,255,.65); --faint:rgba(255,255,255,.44);
    --brand:#d033e0; --brand6:#b31cc4; --brandL:#e879f9; --brandL2:#f0abfc;
    --cyan:#22d3ee; --cyanL:#67e8f9; --lime:#c8e83a; --limeL:#e2f56b;
    --emerald:#34d399; --emeraldL:#6ee7b7; --rose:#f43f6b; --roseL:#fda4af; --oncolor:#fff;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(90% 55% at 100% 0%, rgba(34,211,238,.07), transparent 60%),
      radial-gradient(90% 65% at 0% 0%, rgba(208,51,224,.09), transparent 55%), var(--bg);
    color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; line-height:1.45;
  }
  .num{font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  .app{max-width:1480px; margin:0 auto; padding:18px 28px 46px; display:flex; flex-direction:column; gap:14px}
  .eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.15em; font-weight:600}
  .eyeC{color:var(--cyanL)} .eyeB{color:var(--brandL)}
  .btn{appearance:none; border:0; font:inherit; cursor:pointer; border-radius:999px; font-weight:600; transition:background .16s,transform .1s}
  .btn:active{transform:translateY(.5px)}
  .btn-primary{background:var(--brand); color:#fff; box-shadow:0 0 20px -8px rgba(208,51,224,.9)}
  .btn-primary:hover{background:var(--brand6)}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed; box-shadow:none}

  /* header */
  .top{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:11px}
  .brandmark{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,#7a1683,#4c1452);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .brandtext .ey{font-size:11px;text-transform:uppercase;letter-spacing:.17em;color:var(--cyanL)}
  .brandtext .nm{font-size:16px;font-weight:600;margin-top:2px}
  .viewtoggle{display:inline-flex;background:var(--data);border:1px solid var(--line);border-radius:999px;padding:3px}
  .viewtoggle button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:7px 16px;border-radius:999px;cursor:pointer;transition:background .18s,color .18s}
  .viewtoggle button[aria-pressed="true"]{background:var(--brand);color:#fff;box-shadow:0 0 18px -6px rgba(208,51,224,.9)}

  /* stepper */
  .stepper{display:flex;align-items:center;gap:15px;background:var(--data);border:1px solid var(--line);border-radius:16px;padding:12px 15px}
  .stepbtn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer;display:grid;place-items:center;transition:background .15s}
  .stepbtn:hover:not(:disabled){background:rgba(255,255,255,.09)} .stepbtn:disabled{opacity:.3;cursor:not-allowed}
  .stepmid{flex:1;min-width:0}
  .stepmid .lab{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .stepmid .sh{font-size:16px;font-weight:600}
  .dots{display:flex;gap:5px}
  .dot{width:7px;height:7px;border-radius:999px;background:rgba(255,255,255,.16)}
  .dot.on{background:var(--cyanL)} .dot.past{background:rgba(255,255,255,.4)}
  .disrupt{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#fff;background:var(--rose);padding:3px 9px;border-radius:999px}
  .note{margin-top:4px;font-size:12.5px;color:var(--muted);max-width:74ch}
  .playas{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .playas .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint)}
  .teamtab{appearance:none;border:1px solid var(--line);background:var(--data);color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .teamtab[aria-pressed="true"]{color:var(--ink);border-color:transparent;background:var(--surface2)}
  .teamtab .cr{width:16px;height:16px;border-radius:5px;background:#211a2c;display:grid;place-items:center}

  /* HUD console */
  .hud{position:relative;overflow:hidden;border-radius:16px;background:var(--console);padding:10px;box-shadow:inset 0 0 70px -34px rgba(34,211,238,.5);border:1px solid rgba(34,211,238,.2)}
  .hudwrap{position:relative;display:grid;grid-template-columns:168px 1fr;gap:10px;align-items:stretch}
  .hudside{display:flex;flex-direction:column;justify-content:center;gap:7px;padding:4px 2px 4px 8px}
  .hudtitle{display:flex;align-items:center;gap:8px}
  .pulse{position:relative;width:10px;height:10px;display:grid;place-items:center}
  .pulse i{position:absolute;width:10px;height:10px;border-radius:999px;background:rgba(45,212,191,.6);animation:pp 2s ease-out infinite}
  .pulse b{width:6px;height:6px;border-radius:999px;background:var(--cyan)}
  @keyframes pp{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.4);opacity:0}}
  .hudtitle span{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--cyanL)}
  .hudlive{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .hudrow{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .ro{background:var(--console);padding:10px 11px;display:flex;flex-direction:column;gap:7px}
  .ro .rh{display:flex;align-items:center;gap:7px}
  .ro .ic{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
  .ro .nm{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .ro .sd{width:9px;height:9px;border-radius:999px;flex:0 0 auto}
  .ro .val{display:flex;align-items:baseline;gap:7px}
  .ro .valn{font-size:28px;font-weight:700;line-height:1}
  .ro .vald{font-size:13px;font-weight:700}
  .hbar{height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
  .hbar>i{display:block;height:100%;width:0;border-radius:999px;transition:width .75s cubic-bezier(.2,.7,.2,1)}

  /* layout columns */
  .cols{display:grid;grid-template-columns:minmax(360px,1fr) 1.4fr;gap:16px;align-items:start}
  .zonehead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .card{background:var(--data);border:1px solid rgba(34,211,238,.16);border-radius:16px;padding:14px}
  .dhead{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line2);padding-bottom:10px;margin-bottom:11px}
  .dhead .ti{width:24px;height:24px;border-radius:7px;background:rgba(34,211,238,.14);border:1px solid rgba(34,211,238,.25);display:grid;place-items:center;color:var(--cyanL);font-size:12px}
  .dhead h3{margin:0;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.13em;color:var(--cyanL)}
  .issue{background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:10px;padding:10px 11px;margin-bottom:8px}
  .issue .it{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .issue .itt{font-size:13px;font-weight:600}
  .sev{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:999px}
  .sev.high{background:rgba(244,63,107,.18);color:#ff8aa3}.sev.medium{background:rgba(208,51,224,.16);color:var(--brandL)}.sev.low{background:rgba(255,255,255,.08);color:var(--muted)}
  .issue .id{font-size:11.5px;color:var(--muted);margin-top:3px}
  .disbox{background:rgba(244,63,107,.1);border-color:rgba(244,63,107,.4)!important}
  .disbox .itt{color:#ff8aa3}

  /* Decide panel */
  .decide{position:relative;overflow:hidden;background:var(--decide);border:1px solid rgba(208,51,224,.3);border-radius:18px;box-shadow:0 0 50px -24px rgba(208,51,224,.6)}
  .decide .wash{position:absolute;inset:0 0 auto 0;height:120px;background:radial-gradient(120% 100% at 50% 0%, rgba(208,51,224,.14), transparent 70%);pointer-events:none}
  .dtop{position:relative;display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0}
  .dtop .ey{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--brandL);font-weight:600}
  .dtop .st{font-size:17px;font-weight:600;margin-top:2px}
  .donepill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;background:rgba(52,211,153,.18);color:var(--emeraldL);padding:4px 10px;border-radius:999px}
  .tabs{position:relative;display:flex;gap:4px;margin:11px 16px 0;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:4px}
  .tab{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;padding:9px 6px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:background .15s,color .15s}
  .tab[aria-pressed="true"]{background:var(--brand);color:#fff;box-shadow:0 0 18px -6px rgba(208,51,224,.9)}
  .tab .n{width:19px;height:19px;border-radius:999px;display:grid;place-items:center;font-size:11px;font-weight:700;background:rgba(255,255,255,.1);color:var(--muted)}
  .tab[aria-pressed="true"] .n{background:rgba(255,255,255,.22);color:#fff}
  .tab .n.done{background:var(--emerald);color:#fff}
  .dbody{position:relative;padding:15px 16px}
  .sh2{font-size:17px;font-weight:600;margin:0}
  .shn{font-size:12.5px;color:var(--muted);margin:3px 0 1px}
  .shi{font-size:12px;color:rgba(255,255,255,.82);font-weight:500;margin:0 0 11px}
  .optgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .opt{appearance:none;text-align:left;font:inherit;cursor:pointer;border-radius:11px;padding:11px 12px;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;
    background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);transition:background .14s,border-color .14s,box-shadow .14s}
  .opt:hover{background:rgba(255,255,255,.08)}
  .opt[aria-pressed="true"]{background:var(--brand);border-color:transparent;color:#fff;box-shadow:0 0 20px -7px rgba(208,51,224,.9)}
  .opt .mk{width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:0 0 auto;font-size:12px}
  .opt[aria-pressed="true"] .mk{background:rgba(255,255,255,.2)}
  .divider{border-top:1px solid var(--line);margin:15px 0 0;padding-top:14px}
  .insetblk{background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:11px}
  .albar{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .albar .track{flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
  .albar .track>i{display:block;height:100%;border-radius:999px;transition:width .3s,background .3s}
  .altot{font-size:13px;font-weight:700}
  .arow{display:flex;align-items:center;gap:11px;margin-bottom:9px}
  .arow .an{width:148px;flex:0 0 auto;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.85)}
  .arow input[type=range]{flex:1;accent-color:var(--brand)}
  .arow .av{width:44px;text-align:right;font-size:13px;font-weight:600}
  .confgrid{display:flex;flex-direction:column;gap:9px}
  .conf{appearance:none;text-align:left;font:inherit;cursor:pointer;border-radius:11px;padding:12px 13px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);transition:background .14s,border-color .14s,box-shadow .14s}
  .conf[aria-pressed="true"]{background:var(--brand);border-color:transparent;box-shadow:0 0 20px -7px rgba(208,51,224,.9)}
  .conf .ct{display:flex;align-items:center;gap:9px}
  .conf .cm{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.1)}
  .conf[aria-pressed="true"] .cm{background:rgba(255,255,255,.22)}
  .conf .cl{font-size:14px;font-weight:600}
  .conf .cd{font-size:12px;color:var(--muted);margin-top:4px}
  .conf[aria-pressed="true"] .cd{color:rgba(255,255,255,.85)}
  .persona{display:flex;gap:11px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:11px}
  .pav{width:42px;height:42px;border-radius:999px;background:#211a2c;display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .pn{font-size:13.5px;font-weight:600}.pr{font-size:11.5px;color:var(--muted)}
  .ps{font-size:12.5px;color:rgba(255,255,255,.82);margin-top:7px;line-height:1.45}
  .pq{font-size:12.5px;font-style:italic;color:var(--brandL);margin-top:8px}
  .peoplist{display:flex;flex-direction:column;gap:8px}
  .dfoot{position:relative;border-top:1px solid var(--line);padding:14px 16px}
  .bigbtn{width:100%;padding:13px;font-size:14px;border-radius:12px}

  /* results strip */
  .results{background:var(--data);border:1px solid rgba(52,211,153,.3);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
  .rbanner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .rbanner .mv{display:flex;align-items:baseline;gap:9px}
  .rbanner .mvn{font-size:30px;font-weight:700}
  .rankbadge{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--brand);color:#fff;padding:7px 16px;border-radius:12px;box-shadow:0 0 22px -8px rgba(208,51,224,.9)}
  .rankbadge .k{font-size:10px;text-transform:uppercase;letter-spacing:.1em;opacity:.85}.rankbadge .v{font-size:20px;font-weight:700;line-height:1}
  .drivers{display:grid;grid-template-columns:repeat(2,1fr);gap:7px 14px}
  .dr{display:flex;align-items:center;gap:8px}.dr .drn{font-size:12px;color:var(--muted);flex:1}.dr .drv{font-size:13px;font-weight:700}
  .delta-up{color:var(--emeraldL)}.delta-dn{color:var(--roseL)}.delta-fl{color:var(--faint)}

  /* facilitator */
  .lb{display:flex;flex-direction:column;gap:7px}
  .lbhead{display:grid;grid-template-columns:34px 1fr 96px 92px;gap:10px;padding:0 12px 2px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint)}
  .lbrows{display:flex;flex-direction:column;gap:7px}
  .row{display:grid;grid-template-columns:34px 1fr 96px 92px;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line2);will-change:transform}
  .row.lead{background:linear-gradient(100deg,rgba(208,51,224,.92),rgba(179,28,196,.82));border-color:transparent;box-shadow:0 0 26px -10px rgba(208,51,224,.9)}
  .rk{font-size:17px;font-weight:700;color:var(--faint)}.row.lead .rk{color:rgba(255,255,255,.85)}
  .teamcell{display:flex;align-items:center;gap:10px;min-width:0}
  .crest{width:30px;height:30px;border-radius:9px;background:#211a2c;display:grid;place-items:center;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
  .row.lead .crest{background:rgba(255,255,255,.14)}
  .tn{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ts{font-size:11.5px;color:var(--muted)}.row.lead .ts{color:rgba(255,255,255,.75)}
  .sc{text-align:right;font-size:18px;font-weight:700}
  .mvcell{text-align:right}.mvcell .pill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;background:rgba(52,211,153,.18);color:var(--emeraldL);font-size:13px;font-weight:700}
  .row.lead .mvcell .pill{background:rgba(255,255,255,.2);color:#fff}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .ccard{background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:13px;display:flex;flex-direction:column;gap:11px}
  .cctop{display:flex;align-items:center;gap:8px}.cctop .tn{font-size:13.5px}.ccrank{margin-left:auto;font-size:12px;font-weight:700;color:var(--faint)}
  .decrow{display:flex;flex-wrap:wrap;gap:5px}
  .dchip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line2);color:rgba(255,255,255,.82)}
  .dchip.pri{background:rgba(208,51,224,.16);color:var(--brandL);border-color:transparent}
  .goals5{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  .g .gl{font-size:10px;text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .g .gv{display:flex;align-items:baseline;justify-content:space-between;gap:3px;margin-top:2px}.g .gvn{font-size:15px;font-weight:700}.g .gd{font-size:10.5px;font-weight:700}
  .bar{height:6px;border-radius:999px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden}.bar>i{display:block;height:100%;width:0;border-radius:999px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
  .ask{background:rgba(208,51,224,.14);border:1px solid rgba(232,121,249,.22);border-radius:9px;padding:9px 11px}
  .ask .l{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--brandL);margin-bottom:5px}
  .ask p{margin:0;font-size:12.5px;font-style:italic;color:rgba(255,255,255,.9);line-height:1.4}
  .cdrivers{display:grid;grid-template-columns:repeat(2,1fr);gap:5px 11px}
  .cdr{display:flex;align-items:center;gap:6px}.cdr .n{font-size:11px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cdr .v{font-size:12px;font-weight:700}

  .footn{font-size:11.5px;color:var(--faint);text-align:center;padding-top:2px}.footn b{color:var(--muted);font-weight:600}
  @media (max-width:900px){.cols{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,1fr)}.hudwrap{grid-template-columns:1fr}.hudrow{grid-template-columns:repeat(5,1fr)}}
  @media (max-width:560px){.hudrow{grid-template-columns:repeat(2,1fr)}.optgrid{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><div class="brandmark" id="brandmark"></div>
      <div class="brandtext"><div class="ey">Plumfield Stores &middot; NCP preview</div><div class="nm">Leadership Simulation</div></div></div>
    <div class="viewtoggle" role="group" aria-label="View">
      <button id="vTeam" aria-pressed="true">Team view</button>
      <button id="vFac" aria-pressed="false">Facilitator view</button>
    </div>
  </div>

  <div class="stepper">
    <button class="stepbtn" id="prev" aria-label="Previous shift">&#8592;</button>
    <div class="stepmid">
      <div class="lab"><span class="sh" id="shLabel">Shift 3</span><span class="dots" id="dots"></span><span id="disruptFlag"></span></div>
      <div class="note" id="note"></div>
    </div>
    <button class="stepbtn" id="next" aria-label="Next shift">&#8594;</button>
  </div>

  <div class="playas" id="playasWrap">
    <span class="lbl">Playing as</span><span id="teamTabs" style="display:inline-flex;gap:6px;flex-wrap:wrap"></span>
  </div>

  <div id="main"></div>

  <div class="footn">Fully scripted demo on authentic engine figures. Make the calls on the right; the shift resolves to the story. <b>Watch shift 5: Paradise overtakes - then flip to Facilitator and read Arndale's hidden drivers.</b></div>

<script>

    r.innerHTML='<div class="rk num">#'+t.rank+'</div><div class="teamcell"><div class="crest">'+storefront(lead?"#fff":TEAM_ACCENT[t.name],20)+'</div><div style="min-width:0"><div class="tn">'+t.name+'</div><div class="ts">'+siteOf(t.name)+'</div></div></div><div class="sc num">'+t.score+'</div><div class="mvcell"><span class="pill num">&#9650; +'+t.movement+'</span></div>';}
  if(reduce)return;
  requestAnimationFrame(()=>{for(const n in lbRows){const r=lbRows[n];const dy=first[n]-r.getBoundingClientRect().top;if(Math.abs(dy)<1)continue;r.style.transition="none";r.style.transform="translateY("+dy+"px)";requestAnimationFrame(()=>{r.style.transition="transform .55s cubic-bezier(.2,.7,.2,1)";r.style.transform="";});}});
}

/* ---------- Team view ---------- */
function renderTeam(){
  const name=DATA.teams[playIdx].name;
  let hud;
  if(phase==="results"){ hud=hudHTML(teamAt(shiftIdx,name).goals,true); }
  else { const prev=DATA.shifts[shiftIdx-1].teams.find(x=>x.name===name); hud=hudHTML(prev.goals.map(g=>({key:g.key,value:g.value})),false); }
  const right = phase==="results" ? (resultsHTML()+'<div style="height:14px"></div>'+decideHTML()) : decideHTML();
  document.getElementById("main").innerHTML = hud+'<div style="height:14px"></div><div class="cols"><div>'+contextHTML()+'</div><div>'+right+'</div></div>';
  wireDecide();
  animateBars(document.getElementById("main"));
}

function wireDecide(){
  document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{activeTab=+b.dataset.tab;renderTeam();}));
  document.querySelectorAll(".opt,.conf").forEach(b=>b.addEventListener("click",()=>{
    if(phase==="results")return;
    const g=b.dataset.group, v=decodeURIComponent(b.dataset.val);
    if(g==="priority")picks.priority=v; else if(g==="action")picks.action=v; else if(g==="leadership")picks.leadership=v;
    else if(g==="moment")picks.moment=v; else if(g==="confidence")picks.confidence=v;
    renderTeam();
  }));
  document.querySelectorAll("input[data-alloc]").forEach(s=>s.addEventListener("input",()=>{picks.alloc[s.dataset.alloc]=+s.value;renderTeam();}));
  document.querySelectorAll("input[data-effort]").forEach(s=>s.addEventListener("input",()=>{picks.effort[+s.dataset.effort]=+s.value;renderTeam();}));
  const end=document.getElementById("endShift"); if(end)end.addEventListener("click",()=>{phase="results";renderTeam();});
  const nx=document.getElementById("nextShift"); if(nx)nx.addEventListener("click",()=>{
    if(shiftIdx>=MAX){shiftIdx=MIN;} else {shiftIdx++;}
    phase="decide";activeTab=1;initPicks();render();
  });
}

function animateBars(root){const bars=root.querySelectorAll("i[data-w]");if(reduce){bars.forEach(b=>b.style.width=b.dataset.w+"%");return;}requestAnimationFrame(()=>requestAnimationFrame(()=>bars.forEach(b=>b.style.width=b.dataset.w+"%")));}

function render(){
  renderStepper();
  document.getElementById("vTeam").setAttribute("aria-pressed",view==="team");
  document.getElementById("vFac").setAttribute("aria-pressed",view==="fac");
  if(view==="team"){ if(!picks)initPicks(); renderTeam(); } else renderFacilitator();
}

document.getElementById("prev").addEventListener("click",()=>{if(shiftIdx>MIN){shiftIdx--;phase="decide";activeTab=1;picks=null;render();}});
document.getElementById("next").addEventListener("click",()=>{if(shiftIdx<MAX){shiftIdx++;phase="decide";activeTab=1;picks=null;render();}});
document.getElementById("vTeam").addEventListener("click",()=>{view="team";render();});
document.getElementById("vFac").addEventListener("click",()=>{view="fac";render();});

initPicks(); render();
</script>
</body>
</html>
